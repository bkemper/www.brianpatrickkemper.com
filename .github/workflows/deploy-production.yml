name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # Must match WorkflowStack OIDC subject: environment:production
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install infra dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Deploy Amplify Hosting
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CDK_DISABLE_TELEMETRY: "1"
          CDK_ENV: production
        run: pnpm infra run cdk deploy ProductionAmplifyStack --require-approval never
