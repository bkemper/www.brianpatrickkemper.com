version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10.10.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter @bpk/www build
  artifacts:
    baseDirectory: www/dist/client
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - www/node_modules/**/*
